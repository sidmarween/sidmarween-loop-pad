<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Marv PAD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Marv PAD – Live-Looper mit 12 Pads, XY-Effekten, Sequenzer, ACID 303 und DRUM 909 im Browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: eine Spalte wie die App – Kopf, Regler, Funktionsleiste, XY/Instrument, 12 Pads, Sequenzer, Fußzeile */
:root {
  --bg: #0d0e11; --bg2: #121318; --panel: #17181d; --panel2: #1f2128; --line: #2b2e36; --ink: #f1f1f3; --muted: #8b909b;
  --accent: #ff6a00; --accent2: #ffb000; --pad: #15161b; --pad2: #1b1d23; --lcd: #090b0f; --lcdink: #ff8a2a;
  --red: #ff2d46; --green: #28e66e; --yellow: #ffbe1e; --blue: #5aa0ff;
  --r: 12px; --padr: 14px; --bw: 1px;
  --f-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif; --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
body[data-design="neon"] { --bg: #0a0912; --bg2: #100e1c; --panel: #121022; --panel2: #1a1730; --line: #2d2850; --accent: #ff2bd6; --accent2: #2bf0ff; --pad: #0e0c1a; --pad2: #15122a; --lcd: #06060c; --lcdink: #2bf0ff; }
body[data-design="studio"] { --bg: #2a2d32; --bg2: #303339; --panel: #383b42; --panel2: #43474e; --line: #50545c; --accent: #ff7a1a; --pad: #3a3d43; --pad2: #44484f; --lcd: #15171a; }
body[data-design="glow"] { --bg: #120a05; --bg2: #180d06; --panel: #1d120a; --panel2: #26170c; --line: #3a2414; --accent: #ff8c32; --accent2: #ffd27a; --pad: #180e07; --pad2: #22140a; --lcd: #180c04; --lcdink: #ff9a46; }
body[data-design="hud"] { --bg: #0b1016; --bg2: #0f151d; --panel: #111923; --panel2: #16212d; --line: #24384a; --accent: #ff8228; --accent2: #3fd0ff; --pad: #0e141b; --pad2: #131c26; --lcd: #070b10; --padr: 6px; --r: 6px; }
body[data-design="retro"] { --bg: #d7d2c4; --bg2: #cfc9b9; --panel: #c4bdab; --panel2: #b9b19d; --line: #8e8674; --ink: #2b2a26; --muted: #5d5a50; --accent: #e25b1a; --accent2: #2d7a3a; --pad: #e6e1d4; --pad2: #ddd7c8; --lcd: #9bb08a; --lcdink: #1f2b16; --padr: 5px; --r: 5px; color-scheme: light; }
body[data-design="comic"] { --bg: #fff3cf; --bg2: #ffe9a8; --panel: #ffffff; --panel2: #fff7de; --line: #111; --ink: #111; --muted: #444; --accent: #e8178a; --accent2: #1a8cff; --pad: #ffffff; --pad2: #fff3cf; --lcd: #111; --lcdink: #ffe14a; --bw: 3px; --padr: 18px; color-scheme: light; }
body[data-design="glas"] { --bg: #0f1620; --bg2: #1b2735; --panel: rgba(255,255,255,.07); --panel2: rgba(255,255,255,.12); --line: rgba(255,255,255,.18); --accent: #5ec8ff; --accent2: #b98cff; --pad: rgba(255,255,255,.06); --pad2: rgba(255,255,255,.1); --lcd: rgba(0,0,0,.35); --lcdink: #8fe0ff; }
body[data-design="pastell"] { --bg: #f2ecf7; --bg2: #e9e0f3; --panel: #ffffff; --panel2: #f6f1fb; --line: #d6cbe4; --ink: #3a3350; --muted: #7a7192; --accent: #a978f0; --accent2: #f08cb4; --pad: #ffffff; --pad2: #f4eefb; --lcd: #3a3350; --lcdink: #f6d6ff; color-scheme: light; }
body[data-design="holz"] { --bg: #2b1d14; --bg2: #34241a; --panel: #3b281b; --panel2: #4a3322; --line: #5c412b; --ink: #f3e6d3; --muted: #bfa88a; --accent: #e0a050; --pad: #3b281b; --pad2: #4a3322; --lcd: #1d130c; --lcdink: #ffc36e; }
body[data-design="creme"] { --bg: #f1e9da; --bg2: #e8dfcd; --panel: #fffaf0; --panel2: #f6eee0; --line: #d8cbb4; --ink: #3b3127; --muted: #7c6f5f; --accent: #d4612a; --pad: #fffaf0; --pad2: #f4ecdd; --lcd: #3b3127; --lcdink: #ffd59a; color-scheme: light; }
body[data-design="grau"] { --bg: #3c3f44; --bg2: #43474c; --panel: #4a4e54; --panel2: #555a61; --line: #646971; --ink: #eef0f2; --muted: #b3b8bf; --accent: #9fe870; --pad: #4a4e54; --pad2: #555a61; --lcd: #23262a; --lcdink: #b9f58f; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg)); background-color: var(--bg); color: var(--ink); font: 600 13px/1.25 var(--f-ui); overflow-x: hidden; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; }
#app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 8px; padding-block: 8px 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.top { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.logo { height: 40px; width: auto; display: block; }
.lcd { position: relative; height: 56px; border-radius: 9px; background: var(--lcd); border: 1.5px solid color-mix(in srgb, var(--accent) 70%, transparent); color: var(--lcdink); padding: 5px 9px; font-family: var(--f-mono); overflow: hidden; cursor: pointer; min-width: 0; }
.lcd::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(255,255,255,.035) 2px 3px); pointer-events: none; }
.lcd .l1 { font-size: 9px; opacity: .75; display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; }
.lcd .l2 { font-size: 16px; font-weight: 700; letter-spacing: .04em; text-shadow: 0 0 8px currentColor; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lcd .l3 { font-size: 8.5px; opacity: .85; white-space: nowrap; overflow: hidden; }
.lcd .bpm { font-size: 11px; font-weight: 700; }
.lcd .bar { position: absolute; left: 9px; right: 9px; bottom: 4px; height: 2px; background: color-mix(in srgb, var(--lcdink) 18%, transparent); }
.lcd .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lcdink); }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: var(--bw) solid color-mix(in srgb, var(--accent) 80%, transparent); background: var(--panel); display: grid; place-items: center; font-size: 18px; cursor: pointer; }
.knobs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: none; cursor: ns-resize; }
.knob canvas { width: 54px; height: 54px; }
.knob .kl { font-size: 9.5px; color: var(--muted); letter-spacing: .06em; text-align: center; white-space: nowrap; overflow: hidden; max-width: 100%; }
.funcrow { display: grid; grid-template-columns: 1fr 1fr 1fr 64px 1fr 1fr 1fr; gap: 5px; align-items: center; }
.fbtn { height: 38px; border-radius: 9px; border: var(--bw) solid var(--line); background: var(--panel); font-size: 10px; letter-spacing: .04em; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; cursor: pointer; touch-action: none; padding: 0 2px; min-width: 0; }
.fbtn small { font-size: 8.5px; opacity: .85; font-weight: 500; white-space: nowrap; }
.fbtn.on { background: var(--fc, var(--accent)); color: #fff; border-color: #fff; box-shadow: 0 0 14px color-mix(in srgb, var(--fc, var(--accent)) 60%, transparent); }
.fxbtn { height: 52px; width: 64px; border-radius: 50%; border: 2px solid var(--accent); background: radial-gradient(circle at 40% 35%, var(--panel2), var(--panel)); display: grid; place-items: center; font-size: 9px; text-align: center; cursor: pointer; touch-action: none; justify-self: center; line-height: 1.1; }
.fxbtn b { display: block; font-size: 10px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tab { height: 28px; border-radius: 14px; border: var(--bw) solid var(--line); background: var(--panel); font-size: 11px; cursor: pointer; position: relative; }
.tab.on { background: var(--accent); color: #fff; border-color: transparent; }
.tab .dot { position: absolute; right: 9px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--accent); }
.tab.on .dot { background: #fff; }
.stage { position: relative; min-height: 150px; flex: 1 0 150px; border-radius: var(--r); overflow: hidden; border: 1.5px solid color-mix(in srgb, var(--accent) 60%, transparent); background: var(--panel); touch-action: none; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.pads-wrap { position: relative; }
.pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 10px; }
.cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pad { position: relative; aspect-ratio: 1 / .92; border-radius: var(--padr); background: linear-gradient(180deg, var(--pad2), var(--pad)); border: var(--bw) solid var(--line); touch-action: none; cursor: pointer; overflow: hidden; }
.pad .plabel { position: absolute; left: 0; right: 0; bottom: 8%; text-align: center; font-size: clamp(9px, 2.6vw, 12px); color: var(--ink); opacity: .9; font-family: var(--f-mono); }
.pad .pempty { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; color: color-mix(in srgb, var(--ink) 55%, transparent); font-size: 10px; gap: 2px; pointer-events: none; }
.pad .pempty b { font-size: 26px; line-height: 1; font-weight: 500; }
.pad .pimport { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 7px; border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent); background: color-mix(in srgb, var(--ink) 10%, transparent); font-size: 13px; display: grid; place-items: center; cursor: pointer; }
.pad .pfx { position: absolute; right: 5px; bottom: 5px; height: 17px; padding: 0 5px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--ink) 40%, transparent); background: color-mix(in srgb, var(--panel) 80%, transparent); font-size: 8.5px; display: flex; align-items: center; gap: 3px; cursor: pointer; }
.pad .pfx i { width: 4px; height: 4px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 30%, transparent); }
.pad .pfx i.f { background: var(--accent); }
.pad .pfx.on { background: var(--accent); color: #fff; border-color: #fff; }
.pad .pfx.on i.f { background: #fff; }
.pad .pbadge { position: absolute; top: 5px; width: 17px; height: 17px; border-radius: 50%; font-size: 10px; color: #000; display: grid; place-items: center; }
.pad.dim::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.pad.scene { background: var(--panel); }
.pad.scene.ex { background: color-mix(in srgb, var(--accent) 22%, var(--panel)); border-color: var(--accent); }
.pad.scene.cur { background: var(--accent); border-color: #fff; color: #fff; }
.pad .sct { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; font-size: 10px; pointer-events: none; }
.pad .sct b { font-size: 26px; display: block; }
.under { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 4%; }
.under button { height: 18px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); font-size: 10px; line-height: 1; cursor: pointer; padding: 0; }
#padfx { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
.seq { border-radius: var(--r); background: var(--panel); border: 1.5px solid color-mix(in srgb, var(--accent) 60%, transparent); padding: 8px; display: grid; gap: 7px; }
.steps { display: grid; grid-template-columns: repeat(16, 1fr); gap: 3px; touch-action: none; }
.step { position: relative; height: 30px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 6%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); overflow: hidden; cursor: pointer; }
.step:nth-child(4n+1) { background: color-mix(in srgb, var(--ink) 11%, transparent); }
.step:nth-child(4n+1):not(:first-child) { margin-left: 3px; }
.step .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); }
.step.cur { border-color: var(--ink); border-width: 2px; }
.step .dots { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); font-size: 7px; letter-spacing: -1px; color: var(--ink); opacity: .8; }
.step .nd { position: absolute; top: 3px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--ink); }
.transport { display: flex; gap: 6px; align-items: stretch; }
.tbtn { width: 44px; height: 40px; border-radius: 8px; border: 1.4px solid var(--line); background: var(--panel2); display: grid; place-items: center; font-size: 15px; cursor: pointer; touch-action: none; flex: none; }
.tbtn.rec { color: var(--red); } .tbtn.rec.on { background: var(--red); color: #fff; animation: blink .5s steps(2) infinite alternate; }
.tbtn.play { color: var(--green); } .tbtn.play.on { background: var(--green); color: #000; }
.tbtn.small { width: 38px; font-size: 16px; flex-direction: column; line-height: .9; }
.tbtn.small small { font-size: 7px; }
.tbtn.off { opacity: .35; }
@keyframes blink { to { filter: brightness(1.5); } }
.seqinfo { min-width: 0; flex: 1; font-size: 10px; color: var(--muted); display: flex; flex-direction: column; justify-content: center; gap: 2px; white-space: nowrap; overflow: hidden; }
.seqinfo b { color: var(--accent); font-size: 11.5px; }
.seqinfo b.red { color: var(--red); }
.foot { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; }
.pill { height: 24px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 10px; cursor: pointer; white-space: nowrap; overflow: hidden; }
.pill.on { background: var(--accent); color: #fff; border-color: transparent; }
.modetext { height: 24px; display: grid; place-items: center; font-size: 11px; color: var(--accent); width: 100%; text-align: center; }
.credit { font-size: 9.5px; color: color-mix(in srgb, var(--accent) 80%, transparent); }
/* Overlays */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(560px, 100%); max-height: 86%; overflow: auto; background: var(--panel); color: var(--ink); border-radius: 18px 18px 0 0; border: 1.5px solid var(--accent); border-bottom: 0; padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; font-weight: 500; }
.sheet h3 { margin: 0 0 2px; font-size: 16px; color: var(--accent); }
.sheet .item { text-align: left; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; font-size: 13.5px; }
.sheet .item:active { background: var(--accent); color: #fff; }
.sheet .note { font-size: 12px; color: var(--muted); }
.sheet .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sheet .row > * { flex: 1; }
.sheet input[type=range] { width: 100%; accent-color: var(--accent); }
.sheet .big { font: 700 38px var(--f-mono); color: var(--accent); text-align: center; }
.sheet label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.sheet .btn { padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; text-align: center; }
.sheet .btn.pri { background: var(--accent); color: #fff; border-color: transparent; }
.sheet .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sheet .slot { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 6px; }
.sheet .slot h4 { margin: 0; font-size: 13px; color: var(--accent); }
.sheet .lab { font-size: 11px; color: var(--muted); }
.full { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 70%, transparent); display: flex; align-items: flex-end; justify-content: center; }
.full .box { width: min(560px, 100%); height: min(78%, 680px); background: var(--panel); border: 2px solid var(--accent); border-radius: 16px 16px 0 0; position: relative; touch-action: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
.full canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: min(520px, 92%); background: color-mix(in srgb, var(--panel) 92%, #000); color: var(--ink); border: 1px solid var(--accent); padding: 9px 14px; border-radius: 12px; font-size: 12.5px; font-weight: 500; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none; text-align: center; }
#toast.show { opacity: 1; }
#info { position: fixed; left: 50%; transform: translateX(-50%); width: min(540px, 94%); z-index: 55; background: rgba(18,18,24,.96); color: #fff; border: 2px solid var(--accent); border-radius: 14px; padding: 12px 14px; font-weight: 500; font-size: 13px; line-height: 1.4; }
#info h4 { margin: 0 0 6px; color: var(--accent); font-size: 15px; }
.infohi { outline: 3px solid var(--accent) !important; outline-offset: 3px; }
#splash { position: fixed; inset: 0; z-index: 100; background: #16191e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; cursor: pointer; transition: opacity .35s; }
#splash img { width: min(86vw, 520px); height: auto; animation: fadein .5s ease-out; }
#splash .ver { color: #fff; font: 500 12px var(--f-ui); text-align: center; line-height: 1.6; }
#splash .ver span { opacity: .8; font-size: 11px; }
#splash .go { color: #ff6a00; font: 700 14px var(--f-ui); letter-spacing: .08em; opacity: 0; transition: opacity .3s; }
@keyframes fadein { from { opacity: 0; transform: scale(.97); } }
body[data-design="comic"] .pad, body[data-design="comic"] .seq, body[data-design="comic"] .stage { box-shadow: 4px 4px 0 #111; }
body[data-design="neon"] .pad { border-color: transparent; background: linear-gradient(var(--pad), var(--pad)) padding-box, conic-gradient(from var(--hue, 0deg), #ff2bd6, #2bf0ff, #b6ff2b, #ffcf2b, #ff2bd6) border-box; border: 2px solid transparent; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
@media (max-width: 380px) { .knob canvas { width: 46px; height: 46px; } .fbtn { font-size: 9px; } }
</style>
<div id="app"></div>
<div id="toast"></div>
<div id="splash">
  <img src="splash.jpg" alt="Marv PAD">
  <div class="ver"><div id="splashVer"></div><span>Made with Claude ©marween</span></div>
  <div class="go" id="splashGo">ANTIPPEN ZUM STARTEN</div>
</div>
<script src="app.js"></script>

</body>
</html>
