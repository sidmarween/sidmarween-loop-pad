name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Änderungsliste erzeugen
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/changelog.py || echo "Änderungsliste unverändert"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk "LoopPad-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LoopPad-APK
          path: LoopPad-*.apk

      - name: Release mit APK anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "LoopPad-1.0.${{ github.run_number }}.apk" \
            --title "Loop Pad 1.0.${{ github.run_number }}" \
            --notes "$(python3 -c "import json;e=json.load(open('app/src/main/assets/changelog.json'))[0];print('\n'.join('- '+i for i in e['items']))" 2>/dev/null || echo 'Automatischer Build.')" \
            --latest

      - name: Fehlerlog sichern
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f build.log
          git commit -m "Build-Log Run ${{ github.run_number }}"
          git push -f origin build-log
